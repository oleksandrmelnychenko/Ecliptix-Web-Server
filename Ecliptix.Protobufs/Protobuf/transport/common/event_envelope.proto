syntax = "proto3";

package ecliptix.transport.common;
option csharp_namespace = "Ecliptix.Protobuf.Transport.Common";

message EventMetadata {
  EventIdentity identity = 1;
  ClientContext client = 2;
  SecurityContext security = 3;
  EventOutcome outcome = 4;
}

enum TransportEventType {
  TRANSPORT_EVENT_TYPE_UNSPECIFIED = 0;
  IDENTITY_OPAQUE_REGISTRATION_INIT = 1;
  IDENTITY_OPAQUE_REGISTRATION_COMPLETE = 2;
  IDENTITY_OPAQUE_RECOVERY_INIT = 3;
  IDENTITY_OPAQUE_RECOVERY_COMPLETE = 4;
  IDENTITY_OPAQUE_SIGNIN_INIT = 5;
  IDENTITY_OPAQUE_SIGNIN_COMPLETE = 6;
  IDENTITY_SESSION_LOGOUT = 7;
  IDENTITY_SESSION_LOGOUT_ANONYMOUS = 8;
  IDENTITY_OTP_VERIFY = 9;
  IDENTITY_MOBILE_NUMBER_VALIDATE = 10;
  IDENTITY_MOBILE_NUMBER_AVAILABILITY = 11;
  IDENTITY_RECOVERY_MOBILE_VERIFY = 12;
  IDENTITY_PROFILE_NAME_AVAILABILITY = 13;
  IDENTITY_PROFILE_UPSERT = 14;
  IDENTITY_PROFILE_LOOKUP = 15;
  IDENTITY_OTP_INITIATE = 16;
  IDENTITY_MEMBERSHIP_STATUS= 17;
  DEVICE_REGISTRATION = 101;
  DEVICE_SESSION_HANDSHAKE = 102;
  DEVICE_SESSION_RECOVERY = 103;
  DEVICE_SESSION_AUTH_HANDSHAKE = 104;
  DEVICE_SERVER_KEYS = 105;
}

message EventIdentity {
  string event_id = 1;
  TransportEventType event_type = 2;
  EventContext context = 3;
  string correlation_id = 4;
  string causation_id = 5;
  string partition_key = 6;
  DeliveryKind delivery_kind = 7;
}

message ClientContext {
  string locale = 1;
  string tenant = 2;
  string request_id = 3;
  string idempotency_key = 4;
  string platform = 5;
  string version = 6;
  bytes device_id = 7;
  bytes application_instance_id = 8;
}

message SecurityContext {
  uint32 connect_id = 1;
  string key_exchange_context = 2;
}

message EventOutcome {
  string status = 1;
  string error_code = 2;
  string message_key = 3;
  bool retryable = 4;
  string localized_message = 5;
}

enum DeliveryKind {
  DELIVERY_KIND_UNSPECIFIED = 0;
  DELIVERY_KIND_UNARY = 1;
  DELIVERY_KIND_SERVER_STREAM = 2;
  DELIVERY_KIND_CLIENT_STREAM = 3;
  DELIVERY_KIND_BIDI_STREAM = 4;
}

enum EventContext {
  EVENT_CONTEXT_UNSPECIFIED = 0;
  EVENT_CONTEXT_IDENTITY_ACCESS = 1;
  EVENT_CONTEXT_DEVICE_PROVISIONING = 2;
}

message EventEnvelope {
  EventMetadata metadata = 1;
  bytes payload = 2;
}

syntax = "proto3";

package ecliptix.proto.protocol_state;
option csharp_namespace = "Ecliptix.Protobuf.ProtocolState";

import "common/pub_key_exchange.proto";

// Client-side session snapshot persisted for reconnects.
message EcliptixSessionState {
  uint32 connect_id = 1;
  IdentityKeysState identity_keys = 2;
  ecliptix.proto.protocol.PubKeyExchange peer_handshake_message = 3;
  RatchetState ratchet_state = 4;
  bytes native_state = 5;
  bytes native_peer_bundle = 6;
  bool native_is_initiator = 7;
  string membership_id = 8;
  bytes account_id = 9;
}

// Legacy placeholders retained for compatibility with persisted state.
message IdentityKeysState {}
message RatchetState {}

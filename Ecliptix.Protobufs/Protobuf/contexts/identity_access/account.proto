syntax = "proto3";

package ecliptix.proto.account;
option csharp_namespace = "Ecliptix.Protobuf.Account";

enum AccountType {
  PERSONAL = 0;
  MILITARY = 1;
  BUSINESS = 2;
}

enum AccountStatus {
  INACTIVE = 0;
  ACTIVE = 1;
  SUSPENDED = 2;
  LOCKED = 3;
}

message Account {
  bytes unique_identifier = 1;
  bytes membership_identifier = 2;
  AccountType account_type = 3;
  AccountStatus status = 5;
  bool is_default_account = 6;
  optional string preferred_language = 7;
  optional string time_zone_id = 8;
  optional string region = 9;
}

message AccountProfile {
  bytes profile_id = 1;
  bytes account_id = 2;
  string profile_name = 3;
  string display_name = 4;
}

message CheckProfileNameAvailabilityRequest {
  string profile_name = 1;
}

message CheckProfileNameAvailabilityResponse {
  bool is_available = 1;
  string reason = 2;
}

message CreateOrUpdateProfileRequest {
  bytes account_id = 1;
  string profile_name = 2;
  string display_name = 3;
}

message CreateOrUpdateProfileResponse {
  AccountProfile profile = 1;
  bool is_success = 2;
}

message GetCurrentAccountRequest {
  bytes account_id = 1;
}

message GetCurrentAccountResponse {
  Account account = 1;
  AccountProfile profile = 2;
}

message GetAccountProfileRequest {
  bytes current_account_id = 1;
  oneof search_criteria {
    string by_mobile_number = 2;
    bytes by_account_id = 3;
    string by_username = 4;
  }
}

message GetAccountProfileResponse {
  optional AccountProfile profile = 1;
}

version: '3.9'

services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: ecliptix_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecliptix_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Dev_Password_2024}
      POSTGRES_DB: ${POSTGRES_DB:-ecliptix_memberships}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecliptix_admin} -d ${POSTGRES_DB:-ecliptix_memberships}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecliptix_network
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "log_statement=all"
      - "-c"
      - "log_duration=on"
      - "-c"
      - "log_min_duration_statement=100"

  # pgAdmin 4 - PostgreSQL Web Administration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecliptix_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@ecliptix.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-Admin_2024}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - ecliptix_network
    depends_on:
      postgres:
        condition: service_healthy

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ecliptix_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - ecliptix_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Redis Commander - Optional Web UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: ecliptix_redis_commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - ecliptix_network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
    name: ecliptix_postgres_data
  pgadmin_data:
    driver: local
    name: ecliptix_pgadmin_data
  redis_data:
    driver: local
    name: ecliptix_redis_data

networks:
  ecliptix_network:
    driver: bridge
    name: ecliptix_network